version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - '@synonymdev/pubky'
    groups:
      pubky-stack:
        patterns:
          - '@synonymdev/pubky'
          - '@synonymdev/pubky-*'
          - '@synonymdev/*pubky*'
      dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@synonymdev/*'
        update-types:
          - minor
          - patch
